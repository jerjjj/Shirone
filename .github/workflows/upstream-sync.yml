name: Sync upstream

on:
  schedule:
    # Run weekly at 03:17 UTC (11:17 China Standard Time).
    - cron: "17 3 * * 1"
  workflow_dispatch:

concurrency:
  group: upstream-sync
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Merge LyraVoid/Shirone
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      UPSTREAM_REPOSITORY: LyraVoid/Shirone
      UPSTREAM_REF: main
      SYNC_BRANCH: automation/upstream-sync

    steps:
      - name: Checkout local main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Fetch upstream
        run: |
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --no-tags upstream "${UPSTREAM_REF}"

      - name: Create sync branch and merge upstream
        run: |
          git switch --create "${SYNC_BRANCH}"
          git merge --no-edit --no-ff "upstream/${UPSTREAM_REF}"

      - name: Set up pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 9.14.4
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run upstream validation
        run: |
          pnpm exec astro check
          pnpm check:manifest
          pnpm build

      - name: Open or update synchronization PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/upstream-sync
          base: main
          delete-branch: false
          title: "chore(sync): merge LyraVoid/Shirone updates"
          commit-message: "chore(sync): merge LyraVoid/Shirone updates"
          body: |
            This pull request was generated by the scheduled upstream sync workflow.

            - Upstream: https://github.com/${{ env.UPSTREAM_REPOSITORY }}/tree/${{ env.UPSTREAM_REF }}
            - Validation: `astro check`, manifest checks, and production build

            Review conflicts and any behavior changes before merging.
